<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>オンラインショップ運営 | FJSインターナショナル株式会社</title>
    <link rel="icon" href="https://www.fjsi.co.jp/img/favicon.png">
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body data-page="online-shop">
    <header class="site-header"></header>
    <main>
      <section class="page-hero">
        <p class="eyebrow">Online Shop</p>
        <h1 data-i18n="onlineShopTitle">オンラインショップ運営</h1>
        <p data-i18n="onlineShopLead">オンラインショップの運営を通じて、商品をお客様へ直接届ける販売チャネルを展開しています。</p>
      </section>
      <section class="section online-shop-detail">
        <div class="content-panel">
          <p class="section-kicker" data-i18n="rakutenKicker">Rakuten Store</p>
          <h2 data-i18n="rakutenStoreTitle">FJS楽天市場店</h2>
          <p data-i18n="rakutenStoreLead">FJSインターナショナルの商品を楽天市場でもご覧いただけます。</p>
          <a class="primary-link" href="https://www.rakuten.co.jp/fjsi/" target="_blank" rel="noopener" data-i18n="rakutenButton">楽天市場店を見る</a>
        </div>
      </section>
    </main>
    <footer class="site-footer"></footer>
    <nav class="floating-menu" id="floating-menu" aria-label="Primary navigation"></nav>
    <script src="/app.js"></script>
  </body>
</html>
